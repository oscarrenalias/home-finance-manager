[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "home-finance-analysis"
version = "0.1.0"
description = "Private household finance analysis application"
requires-python = ">=3.11"
dependencies = [
    # UI + backend framework (generates React frontend from Python)
    "reflex>=0.9.0,<1.0",
    # Data access layer
    "sqlalchemy>=2.0.36,<3.0",
    "alembic>=1.13.0,<2.0",
    "psycopg2-binary>=2.9,<3.0",
    # Validation
    "pydantic>=2.9.0,<3.0",
    # LLM orchestration
    "langchain>=0.3.0,<0.4",
    "langchain-core>=0.3.0,<0.4",
    "langchain-openai>=0.2.0,<0.3",
    # LLM proxy / model routing (OpenAI-compatible endpoints)
    "litellm>=1.50.0,<2.0",
    "python-dotenv>=1.2.4",
]

# A dependency group (not an optional extra) so plain `uv sync` installs it in
# every worktree; the Docker image uses `uv sync --no-dev` and excludes it.
[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-playwright>=0.5.0,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/ui",
    "src/domain",
    "src/services",
    "src/storage",
    "src/llm",
    "src/jobs",
    "src/config",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.workspace]
members = []
